name: bwf-clip

services:
  app:
    build: .
    image: bwf-clip-app:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    image: bwf-clip-verify:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8000
    volumes:
      - ./:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
