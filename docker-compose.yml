name: bwf-clip

# BWF clip service.
#   docker compose up app                 # run the API (host port $BWF_CLIP_PORT, default 8080)
#   docker compose up --exit-code-from verify --abort-on-container-exit
#                                         # run tests + build check + smoke, exit code = result
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: bwf-clip-api:${APP_VERSION:-1.0.0}
    environment:
      PORT: "8080"
    ports:
      - "${BWF_CLIP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,sys,urllib.request;u='http://127.0.0.1:%s/healthz'%os.environ.get('PORT','8080');sys.exit(0 if urllib.request.urlopen(u,timeout=2).status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    image: bwf-clip-api:${APP_VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
      APP_WAIT_SECONDS: "60"
    command: ["python", "verify/verify.py"]
    restart: "no"
